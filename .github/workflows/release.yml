name: Build and release

# Every push to main builds the Android APK and the Windows installers, publishes them as the
# latest GitHub Release, and deploys the website (web/) to GitHub Pages. Pushes to other branches
# and pull requests only build, so problems show up before they reach the site.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Load release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set, so the APK is signed with a debug key. See README.md."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Afterglow.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Afterglow.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm version $env:VERSION --no-git-tag-version --allow-same-version
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/Afterglow-Setup.exe
            desktop/dist/Afterglow-Portable.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Afterglow ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          body: |
            **Android:** download `Afterglow.apk` on your phone or tablet and open it to install (Android 7.0+).
            **Windows:** run `Afterglow-Setup.exe`, or `Afterglow-Portable.exe` to play with no install (Windows 10/11, 64-bit).
            **iPhone, iPad and Mac:** install from the website: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#download
          files: |
            out/Afterglow.apk
            out/Afterglow-Setup.exe
            out/Afterglow-Portable.exe

  pages:
    name: Deploy website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the offline cache with this version
        run: sed -i "s/__VERSION__/$VERSION/" web/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
